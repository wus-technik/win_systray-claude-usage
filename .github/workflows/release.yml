name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Validate tag matches project version
        shell: pwsh
        run: |
          $csprojPath = "src/ClaudeUsageTray/ClaudeUsageTray.csproj"
          $csproj = Get-Content -Path $csprojPath -Raw
          if ($csproj -notmatch '<Version>([^<]+)</Version>') {
            Write-Error "Could not find a <Version> element in $csprojPath"
            exit 1
          }
          $version = $Matches[1]
          $tag = $env:GITHUB_REF_NAME
          $expectedTag = "v$version"
          if ($tag -ne $expectedTag) {
            Write-Error "Pushed tag '$tag' does not match the project version. Expected tag '$expectedTag' for <Version>$version</Version> in $csprojPath."
            exit 1
          }
          Write-Host "Tag '$tag' matches project version '$version'."
          Add-Content -Path $env:GITHUB_ENV -Value "VERSION=$version"

      - name: Extract release notes from CHANGELOG.md
        shell: pwsh
        # A release whose version has no changelog section fails here rather than shipping an update
        # nobody can read the changes for. Same spirit as the tag/version check above.
        run: ./build/changelog-section.ps1 -Version $env:VERSION -OutFile artifacts/release-notes.md

      - name: Determine release ring
        shell: pwsh
        # A prerelease version (0.7.2-beta.1) ships to the win-beta channel as a GitHub pre-release,
        # so only opted-in users are offered it. A stable version ships to win *and* is mirrored into
        # win-beta: a win-beta client never reads releases.win.json, so without the mirror beta users
        # would stall after every stable release.
        run: |
          $ring = ./build/release-ring.ps1 -Version $env:VERSION
          $mirror = if ($ring.MirrorChannel) { " (mirrored into '$($ring.MirrorChannel)')" } else { "" }
          Write-Host "Version $env:VERSION ships to channel '$($ring.Channel)'$mirror."
          Add-Content -Path $env:GITHUB_ENV -Value "CHANNEL=$($ring.Channel)"
          Add-Content -Path $env:GITHUB_ENV -Value "MIRROR_CHANNEL=$($ring.MirrorChannel)"
          Add-Content -Path $env:GITHUB_ENV -Value "IS_BETA=$($ring.IsBeta)"

      - name: Restore
        run: dotnet restore

      - name: Test
        run: dotnet test --configuration Release --no-restore

      - name: Assert /releases/latest resolves to a v* tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The setup stub's stable resolution and the README's install link are both built on
        # /releases/latest/download. If some other release (the permanent setup-stub one) has taken the
        # 'latest' title, fail here rather than ship an update onto a broken install path.
        run: |
          $latest = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>$null
          if ($LASTEXITCODE -ne 0) { Write-Host "No latest release yet."; exit 0 }
          if ($latest -notmatch '^v\d') { throw "/releases/latest resolves to '$latest', not a v* tag. Unset 'latest' on that release before releasing." }
          Write-Host "/releases/latest -> $latest"

      - name: Check for existing public releases
        id: check_releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $releases = gh release list --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($releases)) {
            Write-Host "No prior releases found; skipping delta baseline download for this (first) release."
            Add-Content -Path $env:GITHUB_OUTPUT -Value "has_releases=false"
          } else {
            Write-Host "Prior releases found; downloading baseline for delta generation."
            Add-Content -Path $env:GITHUB_OUTPUT -Value "has_releases=true"
          }
          exit 0

      - name: Download previous release assets (delta baseline)
        if: steps.check_releases.outputs.has_releases == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # One baseline per channel about to be packed, or the deltas would be computed against the
        # wrong ring. A channel with no prior release simply yields no baseline and vpk packs a full
        # release, so this must not fail the build.
        run: |
          $channels = @($env:CHANNEL) + @($env:MIRROR_CHANNEL | Where-Object { $_ })
          foreach ($channel in $channels) {
            # Built as an array and splatted: an `if` that yields a one-element array unrolls it to a
            # string, which then splats one character per argument.
            $vpkArgs = @('download', 'github',
              '--repoUrl', 'https://github.com/${{ github.repository }}',
              '--channel', $channel, '--token', $env:GH_TOKEN)
            # --pre for win-beta: real betas are GitHub pre-releases, so the newest beta baseline is
            # only visible when pre-releases are searched.
            if ($channel -eq 'win-beta') { $vpkArgs += '--pre' }
            dnx --yes vpk --version 1.2.0 @vpkArgs
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::warning::No delta baseline for channel '$channel'; packing a full release for it."
            }
          }
          exit 0

      - name: Publish self-contained app
        shell: pwsh
        run: dotnet publish src/ClaudeUsageTray/ClaudeUsageTray.csproj --configuration Release --runtime win-x64 --self-contained true -o artifacts\publish

      - name: Pack Velopack release
        shell: pwsh
        # --packAuthors lands in the package's nuspec verbatim, so the ampersand must arrive already
        # XML-escaped or vpk fails with an XmlException. It reads back as "W&S Technik GmbH".
        # --icon covers what <ApplicationIcon> cannot: Setup.exe and the shortcuts vpk creates.
        # One pack per channel: each writes its own releases.{channel}.json index and channel-named
        # assets, which is what keeps the two rings apart.
        run: |
          $channels = @($env:CHANNEL) + @($env:MIRROR_CHANNEL | Where-Object { $_ })
          foreach ($channel in $channels) {
            dnx --yes vpk --version 1.2.0 pack --packId WusTechnik.ClaudeUsageTray --packTitle "Claude Usage Tray" --packAuthors "W&amp;S Technik GmbH" --packVersion $env:VERSION --packDir artifacts/publish --mainExe ClaudeUsageTray.exe --releaseNotes artifacts/release-notes.md --icon src/ClaudeUsageTray/app.ico --channel $channel
            if ($LASTEXITCODE -ne 0) { throw "vpk pack failed for channel '$channel'" }
          }

      - name: Upload and publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The ring's own channel goes up first and creates the GitHub release; the mirror is merged
        # into that same release afterwards. --pre marks a beta as a GitHub pre-release, which is the
        # second barrier keeping it away from stable clients (they search stable releases only).
        run: |
          $repo = "https://github.com/${{ github.repository }}"
          $name = "Claude Usage Tray $env:VERSION"
          # Built as an array and splatted: an `if` that yields a one-element array unrolls it to a
          # string, which then splats one character per argument.
          $vpkArgs = @('upload', 'github', '--repoUrl', $repo, '--channel', $env:CHANNEL,
            '--publish', '--releaseName', $name, '--tag', "v$env:VERSION",
            '--token', $env:GH_TOKEN)
          if ($env:IS_BETA -eq 'True') { $vpkArgs += '--pre' }
          dnx --yes vpk --version 1.2.0 @vpkArgs
          if ($LASTEXITCODE -ne 0) { throw "vpk upload failed for channel '$env:CHANNEL'" }
          if ($env:MIRROR_CHANNEL) {
            $mirrorArgs = @('upload', 'github', '--repoUrl', $repo, '--channel', $env:MIRROR_CHANNEL,
              '--merge', '--publish', '--releaseName', $name, '--tag', "v$env:VERSION",
              '--token', $env:GH_TOKEN)
            dnx --yes vpk --version 1.2.0 @mirrorArgs
            if ($LASTEXITCODE -ne 0) { throw "vpk upload failed for mirror channel '$env:MIRROR_CHANNEL'" }
          }

      - name: Attach the setup stub
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Copied, not rebuilt: identical bytes on every release, no AOT cost here, and the stub only
        # changes when its own inputs do (setup-stub.yml's paths filter). Missing stub release = warn,
        # not fail: the first release after this workflow lands may run before the stub has ever built.
        run: |
          gh release view setup-stub --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::No setup-stub release yet; ClaudeUsageTraySetup.exe not attached."; exit 0 }
          gh release download setup-stub --repo $env:GITHUB_REPOSITORY --pattern ClaudeUsageTraySetup.exe --dir artifacts/stub
          if ($LASTEXITCODE -ne 0) { throw "could not download ClaudeUsageTraySetup.exe from the setup-stub release" }
          gh release upload "v$env:VERSION" artifacts/stub/ClaudeUsageTraySetup.exe --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw "could not attach ClaudeUsageTraySetup.exe to v$env:VERSION" }
